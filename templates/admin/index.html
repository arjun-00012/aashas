{% extends "admin/index.html" %}
{% load i18n static %}

{% block content %}
<div style="background: #FFFFFF; border: 1px solid rgba(28,25,23,0.1); border-radius: 12px; padding: 18px 22px; margin-bottom: 24px; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 14px; box-shadow: 0 4px 16px rgba(28,25,23,0.06);">
    <div style="min-width: 240px;">
        <div style="display: flex; align-items: center; gap: 8px; margin-bottom: 4px;">
            <span style="background: #16a34a; width: 8px; height: 8px; border-radius: 50%; display: inline-block;"></span>
            <strong style="color: #171614; font-size: 15px; letter-spacing: 0.02em;">ASHAS Management Dashboard</strong>
        </div>
        <p style="margin: 0; color: #635F59; font-size: 13px;">
            Quickly manage categories, products, inventory, orders with Excel export, and customer inquiries.
        </p>
    </div>
    <div style="display: flex; align-items: center; gap: 10px; flex-wrap: wrap;">
        <a href="{% url 'adminpp_dashboard' %}" style="display: inline-flex; align-items: center; gap: 6px; background: #171614; color: #ffffff !important; font-weight: 700; padding: 9px 18px; border-radius: 20px; text-decoration: none; font-size: 13px; box-shadow: 0 2px 5px rgba(23,22,20,0.25);">
            <span>⚡ Open Admin Dashboard</span>
        </a>
        <a href="{% url 'adminpp_orders' %}" style="display: inline-flex; align-items: center; gap: 6px; background: #FAF8F5; color: #171614 !important; font-weight: 600; padding: 9px 16px; border-radius: 20px; text-decoration: none; font-size: 13px; border: 1px solid rgba(28,25,23,0.15);">
            <span>📊 Orders & Export</span>
        </a>
        <a href="{% url 'home' %}" target="_blank" style="display: inline-flex; align-items: center; gap: 5px; background: #FAF8F5; color: #635F59 !important; font-weight: 500; padding: 9px 14px; border-radius: 20px; text-decoration: none; font-size: 13px; border: 1px solid rgba(28,25,23,0.1);">
            <span>🛍️ View Store</span>
        </a>
    </div>
</div>

{{ block.super }}
{% endblock %}
