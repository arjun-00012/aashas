services:
  - type: web
    name: aashas-store
    runtime: python
    buildCommand: "./build.sh"
    startCommand: "gunicorn aashas_store.wsgi:application"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: aashas-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"

databases:
  - name: aashas-db
    plan: free
