{% extends 'base.html' %}

{% block title %}Sign In | AASHAS STORE{% endblock %}

{% block content %}
<div class="container py-5 d-flex justify-content-center align-items-center" style="min-height: 70vh;">
    <div class="p-4 border border-secondary rounded bg-dark w-100 shadow-sm" style="max-width: 400px;">
        <h4 class="text-center fw-bold tracking-wider mb-1">MEMBER ACCESS</h4>
        <p class="text-secondary text-center small mb-4">Enter your credentials to continue</p>

        {% if error %}
        <div class="alert alert-danger py-2 small mb-3">{{ error }}</div>
        {% endif %}

        <form method="POST">
            {% csrf_token %}
            <div class="mb-3">
                <label class="form-label small text-secondary">Username</label>
                <input type="text" name="username" class="form-control" required>
            </div>
            <div class="mb-4">
                <label class="form-label small text-secondary">Password</label>
                <input type="password" name="password" class="form-control" required>
            </div>
            <button type="submit" class="btn btn-light w-100 py-2 fw-semibold">Sign In</button>
        </form>

        <p class="small text-center mt-3 text-secondary mb-0">
            New here? <a href="{% url 'register' %}" class="text-white text-decoration-underline">Create Account</a>
        </p>
    </div>
</div>
{% endblock %}
