<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Form | AASHAS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center justify-content-center py-5">
<div class="container" style="max-width: 600px;">
    <div class="card border-0 shadow-sm p-4">
        <h4 class="fw-bold mb-3">{% if product %}Update{% else %}Create New{% endif %} Product</h4>
        <form method="POST" enctype="multipart/form-data">
            {% csrf_token %}
            
            <div class="row g-3">
                <div class="col-md-6">
                    <label class="form-label small fw-bold">Category</label>
                    {{ form.category }}
                </div>
                <div class="col-md-6">
                    <label class="form-label small fw-bold">Stock Quantity</label>
                    {{ form.stock }}
                </div>
                <div class="col-12">
                    <label class="form-label small fw-bold">Product Name</label>
                    {{ form.name }}
                </div>
                <div class="col-md-6">
                    <label class="form-label small fw-bold">Regular Price (INR)</label>
                    {{ form.price }}
                </div>
                <div class="col-md-6">
                    <label class="form-label small fw-bold">Discount Price (Optional)</label>
                    {{ form.discount_price }}
                </div>
                <div class="col-12">
                    <label class="form-label small fw-bold">Product Image</label>
                    {{ form.image }}
                </div>
                <div class="col-12">
                    <label class="form-label small fw-bold">Description (Optional)</label>
                    {{ form.description }}
                </div>
            </div>

            <button type="submit" class="btn btn-dark w-100 py-2 mt-4">Save Product</button>
            <a href="{% url 'adminpp_dashboard' %}" class="btn btn-link w-100 text-secondary mt-1 text-decoration-none">Cancel</a>
        </form>
    </div>
</div>
</body>
</html>
