<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Category Form</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light p-4">
<div class="container" style="max-width: 500px;">
    <div class="card p-4 shadow-sm">
        <h4>{% if category %}Edit{% else %}Add{% endif %} Category</h4>
        <form method="POST" enctype="multipart/form-data">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="btn btn-dark w-100 mt-2">Save Category</button>
            <a href="{% url 'adminpp_dashboard' %}" class="btn btn-link w-100 text-secondary mt-1">Cancel</a>
        </form>
    </div>
</div>
</body>
</html>
